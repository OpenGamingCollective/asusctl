# Prefer dependency versions whose `rust-version` is compatible with the
# toolchain in rust-toolchain.toml (rustc 1.85). Without this, `cargo update`
# picks the newest semver-compatible versions, many of which require rustc
# >= 1.86/1.87/1.9x and fail to build.
[resolver]
incompatible-rust-versions = "fallback"

[target.'cfg(all())']
rustflags = ["-A", "clippy::collapsible_if"]