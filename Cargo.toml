[workspace.package]
version = "6.4.0"
rust-version = "1.93"
license = "MPL-2.0"
readme = "README.md"
authors = [
  "Luke <luke@ljones.dev>",
  "Denis Benato <benato.denis96@gmail.com>"
]
repository = "https://github.com/OpenGamingCollective/asusctl"
homepage = "https://github.com/OpenGamingCollective/asusctl"
description = "Laptop feature control for ASUS ROG laptops and others"
edition = "2024"

[workspace]
resolver = "2"
members = [
  "asusctl",
  "asusd",
  "asus-shutdown",
  "asusd-user",
  "config-traits",
  "dmi-id",
  "rog-platform",
  "rog-dbus",
  "rog-anime",
  "rog-aura",
  "rog-profiles",
  "rog-control-center",
  "rog-slash",
  "simulators",
  "rog-scsi",
]

default-members = ["asusctl", "asusd", "asus-shutdown", "asusd-user", "rog-control-center"]

[workspace.dependencies]
argh = "^0.1.19"
ashpd = { version = "=0.12.3", default-features = false, features = ["tokio"] }
concat-idents = "^1.1.5"
console-subscriber = "^0.5.0"
dirs = "^6.0.0"
env_logger = { version = "^0.11.11", default-features = false, features = ["auto-color"] }

futures-util = "^0.3.34"
gif = "^0.14.2"
glam = { version = "^0.33.5", features = ["serde"] }
image = "=0.25.10"
inotify = "^0.11.5"
ksni = { version = "^0.3.6", default-features = false, features = ["async-io"] }
libc = "^0.2.189"
log = "^0.4.33"
logind-zbus = { version = "^5.3.2" }
mio = "^1.2.2"
# z = ["zbus", "serde", "async"]
notify-rust = { version = "=4.17.0", default-features = false, features = ["z"] }
nvml-wrapper = "^0.12.1"
# Pix and png_pong pinned because updating to 1.0.1 breaks rog-anime
pix = "=0.13.4"
png = "^0.18.1"
png_pong = "=0.9.3"
ron = "^0.12.2"
rusb = "^0.9.4"
sdl2 = { version = "^0.38.0", default-features = false }
serde = { version = "^1.0.229", features = ["serde_derive"] }
serde_json = "^1.0.151"
slint = { version = "^1.17.1", default-features = false, features = [
  "compat-1-2",
  "gettext",
  "backend-winit-wayland",
  "renderer-femtovg",
] }
slint-build = "=1.17.1"
thiserror = "^2.0.20"
tokio = { version = "^1.53.1", default-features = false, features = [
  "macros",
  "sync",
  "time",
  "rt",
  "rt-multi-thread",
] }
udev = { version = "^0.9.3", features = ["mio"] }
uhid-virt = "^0.0.8"
zbus = "^5.19.0"

[profile.release]
lto = "thin"
debug = false
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1

[workspace.dependencies.cargo-husky]
version = "^1.5.0"
default-features = false
features = ["user-hooks"]
