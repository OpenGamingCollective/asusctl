<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#424853"/>
      <stop offset="0.48" stop-color="#20252e"/>
      <stop offset="1" stop-color="#0d1016"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c13"/>
      <stop offset="0.52" stop-color="#19152a"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303640"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1935"/>
      <stop offset="0.55" stop-color="#b948ff"/>
      <stop offset="1" stop-color="#35cfff"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#7136ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7136ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="keys" width="18" height="9" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="14" height="6" rx="1" fill="#151a22" stroke="#717985" stroke-width="0.45"/>
    </pattern>
    <clipPath id="screen-area">
      <rect x="60" y="28" width="200" height="111" rx="3"/>
    </clipPath>
  </defs>

  <!-- Open display -->
  <rect x="50" y="16" width="220" height="136" rx="9" fill="url(#body)" stroke="#707987" stroke-width="1.5"/>
  <rect x="56" y="22" width="208" height="123" rx="5" fill="#05070b" stroke="#141922"/>
  <rect x="60" y="28" width="200" height="111" rx="3" fill="url(#display)"/>
  <g clip-path="url(#screen-area)">
    <rect x="60" y="28" width="200" height="111" fill="url(#screen-glow)"/>
    <path d="M44 133 L129 25 H159 L74 139 Z" fill="#ff1d3a" opacity="0.10"/>
    <path d="M77 139 L164 28 H177 L91 139 Z" fill="#ff2741" opacity="0.68"/>
    <path d="M101 139 L187 28 H197 L112 139 Z" fill="#ffffff" opacity="0.13"/>
    <path d="M143 139 L226 29 H235 L153 139 Z" fill="#6840ff" opacity="0.44"/>
    <path d="M168 139 L249 34 H266 L188 139 Z" fill="#32cfff" opacity="0.14"/>
    <g fill="none" stroke="#758091" stroke-width="0.55" opacity="0.16">
      <path d="M60 56 H260 M60 84 H260 M60 112 H260"/>
      <path d="M93 28 V139 M127 28 V139 M160 28 V139 M193 28 V139 M227 28 V139"/>
    </g>
    <path d="M71 126 H112 M208 41 H249" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  </g>
  <circle cx="160" cy="21" r="1.4" fill="#7f8996"/>
  <path d="M145 145 H175" stroke="#868f9c" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Hinges -->
  <rect x="65" y="146" width="48" height="7" rx="3" fill="#0b0e13" stroke="#515966"/>
  <rect x="207" y="146" width="48" height="7" rx="3" fill="#0b0e13" stroke="#515966"/>

  <!-- Keyboard deck -->
  <path d="M48 150 H272 L299 181 Q300 184 294 185 H26 Q20 184 21 181 Z" fill="url(#deck)" stroke="#68717e" stroke-width="1.2"/>
  <path d="M67 155 H253 L269 172 H51 Z" fill="#0b0e14" stroke="#3e4652" stroke-width="0.8"/>
  <path d="M72 157 H248 L258 168 H62 Z" fill="url(#keys)"/>
  <path d="M69 170 H251" stroke="url(#rgb)" stroke-width="1.5" opacity="0.85"/>
  <path d="M136 173 H184 L190 181 H130 Z" fill="#141922" stroke="#59626f" stroke-width="0.8"/>
  <path d="M29 185 H291 L283 192 H37 Z" fill="#090c11" stroke="#343b46"/>
  <path d="M58 188 H262" stroke="url(#rgb)" stroke-width="1.2" opacity="0.72"/>
  <path d="M39 178 H61 M259 178 H281" stroke="#66717f" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
</svg>
